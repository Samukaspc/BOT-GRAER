name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verificar pasta src para deploy
        run: npm run verify:deploy

      - name: Instalar dependencias e compilar
        run: npm ci

      - name: Verificar saida do build
        run: test -f dist/index.js
